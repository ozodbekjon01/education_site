{% extends "base.html" %}
{% block title %}Resurslar{% endblock %}

{% block content %}
<style>
.resources-container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 16px;
}

.page-title {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 24px;
    color: var(--text-color);
}

.resource-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 18px 24px;
    border-radius: 14px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.resource-card:hover {
    transform: translateY(-2px);
    border-color: var(--primary);
}

.resource-info {
    display: flex;
    align-items: center;
    gap: 14px;
}

.resource-icon {
    font-size: 1.6rem;
    color: var(--primary);
}

.resource-name {
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--text-color);
}

.download-btn {
    background: var(--primary);
    color: #ffffff;
    padding: 8px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s ease, transform 0.2s ease;
}

.download-btn:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
}

@media(max-width: 600px) {
    .resource-card {
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
    }
    .download-btn {
        justify-content: center;
    }
}
</style>

<div class="resources-container">
    <h1 class="page-title">Foydali Resurslar va Materiallar</h1>

    {% if resources %}
        {% for r in resources %}
        <div class="resource-card">
            <div class="resource-info">
                <i class="fa-solid fa-file-arrow-down resource-icon"></i>
                <div class="resource-name">{{ r[1] }}</div>
            </div>
            <a href="/static/resources/{{ r[2] }}" class="download-btn" download>
                <i class="fa-solid fa-download"></i> Yuklab olish
            </a>
        </div>
        {% endfor %}
    {% else %}
        <div style="background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px; padding:40px; text-align:center; color:var(--text-muted);">
            <i class="fa-solid fa-folder-open" style="font-size:2.5rem; margin-bottom:12px; color:var(--primary);"></i>
            <p style="margin:0; font-size:1.05rem;">Hozircha qo‘shimcha resurslar mavjud emas.</p>
        </div>
    {% endif %}
</div>
{% endblock %}
