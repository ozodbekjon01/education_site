<!DOCTYPE html>

        <!-- Favicon & Brand Icons -->

    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">

    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>Admin-{% block title %}{% endblock %}</title>

<style>
/* Fallback for older browsers without gap support */
.flex-gap-fallback { margin: -8px; }
.flex-gap-fallback > * { margin: 8px; }
.bottom-nav a i { margin-bottom: 4px; }
.navbut i { margin-right: 10px; }
.logo-brand img { margin-right: 12px; }
.courses-grid { display: flex !important; flex-wrap: wrap; margin: -12px; }
.courses-grid > * { flex: 1 1 300px; margin: 12px; max-width: calc(100% - 24px); }
.dash-grid { display: flex !important; flex-wrap: wrap; margin: -10px; }
.dash-grid > * { flex: 1 1 250px; margin: 10px; }
</style>
<script>
window.addEventListener("DOMContentLoaded", function() {
    var flex = document.createElement("div");
    flex.style.display = "flex";
    flex.style.flexDirection = "column";
    flex.style.rowGap = "1px";
    flex.appendChild(document.createElement("div"));
    flex.appendChild(document.createElement("div"));
    document.body.appendChild(flex);
    var isSupported = flex.scrollHeight === 1;
    flex.parentNode.removeChild(flex);

    if (!isSupported) {
        document.body.classList.add("no-flex-gap");
        // Convert all elements with grid/gap to fallback classes if needed
        document.querySelectorAll('.courses-grid, .dash-grid').forEach(function(el) {
            // Already handled by CSS overrides above since we use !important or rely on it
        });
        
        // Add fallback margin to flex containers
        var sheets = document.styleSheets;
        for(var i=0; i<sheets.length; i++) {
            try {
                var rules = sheets[i].cssRules || sheets[i].rules;
                if(!rules) continue;
                for(var j=0; j<rules.length; j++) {
                    if (rules[j].style && rules[j].style.display === 'flex' && rules[j].style.gap) {
                        var gap = parseInt(rules[j].style.gap);
                        if (gap) {
                            sheets[i].insertRule(rules[j].selectorText + ' > * { margin: ' + (gap/2) + 'px; }', rules.length);
                            rules[j].style.margin = '-' + (gap/2) + 'px';
                        }
                    }
                }
            } catch(e) {}
        }
    }
});
</script>

</head>
<body>
