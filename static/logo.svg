<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Modern Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#brandGrad)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="8"/>

  <!-- Academic Cap & Graduation Emblem -->
  <g filter="url(#subtleGlow)">
    <!-- Mortarboard Top (Diamond) -->
    <polygon points="256,108 448,204 256,300 64,204" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- Skullcap Base (Smile Arc with generous negative space) -->
    <path d="M 156,260 C 156,376 356,376 356,260 L 356,306 C 356,422 156,422 156,306 Z" fill="#FFFFFF"/>
    
    <!-- Tassel String & Bob -->
    <path d="M 414,218 L 414,335" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
    <circle cx="414" cy="355" r="20" fill="#FFFFFF"/>
  </g>
</svg>